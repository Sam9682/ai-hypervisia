services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-hypervisia-postgres-${USER_ID}-${HTTP2_PORT:-5000}
    environment:
      POSTGRES_DB: hypervisia_db
      POSTGRES_USER: hypervisia_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hypervisia_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${HTTP_PORT2:-6002}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypervisia_user -d hypervisia_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hypervisia-network

  # Hypervisia Application (Backend API)
  ai-hypervisia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-hypervisia-app-${USER_ID}-${HTTP_PORT:-5000}
    ports:
      - "${HTTP_PORT:-6000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://hypervisia_user:${POSTGRES_PASSWORD:-hypervisia_password}@postgres:5432/hypervisia_db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DOMAIN=${DOMAIN:-localhost}
      - API_URL=${API_URL:-http://localhost:8000}
      - SSL_EMAIL=${SSL_EMAIL:-admin@example.com}
    volumes:
      - app_data:/app/storage
      - ./ssl:/app/ssl:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hypervisia-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-hypervisia-frontend-${USER_ID}-${HTTP2_PORT:-5000}
    ports:
      - "${HTTP2_PORT:-6003}:8001"
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:8001}
    restart: unless-stopped
    networks:
      - hypervisia-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ai-hypervisia-nginx-${USER_ID}-${HTTPS_PORT:-5000}
    ports:
      - "${HTTPS_PORT:-6001}:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai-hypervisia
      - frontend
    restart: unless-stopped
    environment:
      - HTTP_PORT=${HTTP_PORT:-6000}
      - HTTPS_PORT=${HTTPS_PORT:-6001}
    networks:
      - hypervisia-network

volumes:
  postgres_data:
  app_data:

networks:
  hypervisia-network:
    driver: bridge
    name: hypervisia-network-${USER_ID}
